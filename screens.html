<!doctype html>
<html lang="ko"><head>
  <script src="fonts.js?v=xde7urj-unified-3"></script><link rel="stylesheet" href="fonts.css?v=all-regular-4"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BANG! 화면 비교 미리보기</title><style>
*{box-sizing:border-box}button,input,select,textarea{font-family:inherit}body{margin:0;background:#eee;color:#222;font:14px "omnigothic",sans-serif}header{padding:16px 24px;background:white;border-bottom:1px solid #ccc;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}header a{color:#333}main{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 65px)}aside{padding:12px;background:#fff;border-right:1px solid #ccc}input{width:100%;padding:10px;border:1px solid #bbb;border-radius:4px}#list{max-height:calc(100vh - 140px);overflow:auto;margin-top:10px}#list button{display:block;width:100%;border:0;background:white;text-align:left;padding:10px 8px;cursor:pointer}#list button[aria-current=true]{background:#ffe3dc;color:#a11}section{padding:16px;overflow:auto}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar button,.toolbar a{padding:8px 12px;background:#fff;border:1px solid #bbb;border-radius:4px;color:#222;text-decoration:none}.compare{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}figure{margin:0}figcaption{margin-bottom:8px;font-weight:600}iframe,#reference{display:block;width:390px;height:844px;border:0;background:white}#name{font-weight:600}.note{color:#555;font-size:12px;max-width:850px;line-height:1.6}@media(max-width:700px){main{grid-template-columns:1fr}aside{border-right:0}#list{max-height:150px}.compare{gap:18px}iframe,#reference{width:min(390px,calc(100vw - 32px));height:auto;aspect-ratio:390/844}section{padding:16px}}
</style></head><body><header><h1>BANG! 화면 비교 미리보기</h1><a href="index.html">기존 웹사이트 열기</a><span id="count"></span></header><main><aside><input id="search" type="search" placeholder="화면 이름 검색" aria-label="화면 이름 검색"><div id="list"></div></aside><section><div class="toolbar"><button id="previous" type="button">이전 자료</button><button id="next" type="button">다음 자료</button><button id="refresh" type="button">변경 새로고침</button><span id="name"></span><a id="open" target="_blank">화면만 열기</a></div><p class="note">이 목록은 디자인 검토용입니다. 자료의 이름/번호를 실제 게임 진행 순서로 연결하지 않았습니다. 왼쪽은 개별 에셋과 HTML로 구성한 웹 화면, 오른쪽은 비교용 원본 PNG입니다.</p><div class="compare"><figure><figcaption>구현 화면</figcaption><iframe id="preview" title="구현 화면"></iframe></figure><figure><figcaption>최종 디자인 기준 PNG</figcaption><img id="reference" alt="원본 디자인"></figure></div></section></main><script src="data/screens.js"></script><script>
const screens=[...BANG_SCREENS].sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));let selected=0;
function route(s){return s.id===14?'#/home':s.id===15?'#/intro':'#/screen/'+s.id}
function select(index){selected=(index+screens.length)%screens.length;const s=screens[selected];document.querySelector('#preview').src='index.html?review=1&preview='+Date.now()+route(s);document.querySelector('#reference').src=s.reference;document.querySelector('#name').textContent=s.name;document.querySelector('#open').href='index.html'+route(s);history.replaceState(null,'','#'+s.id);renderList();}
function renderList(){const q=document.querySelector('#search').value;const list=document.querySelector('#list');list.replaceChildren();screens.forEach((s,i)=>{if(!s.name.includes(q))return;const b=document.createElement('button');b.textContent=s.name;b.setAttribute('aria-current',i===selected);b.onclick=()=>select(i);list.append(b);});}
document.querySelector('#refresh').onclick=()=>select(selected);
document.querySelector('#count').textContent=screens.length+'개 화면';document.querySelector('#search').oninput=renderList;document.querySelector('#previous').onclick=()=>select(selected-1);document.querySelector('#next').onclick=()=>select(selected+1);select(Math.max(0,screens.findIndex(s=>s.id===Number(location.hash.slice(1)))));
</script></body></html>
