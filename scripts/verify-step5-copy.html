<!doctype html><meta charset="utf-8"><title>판정 2장면 검증</title><style>body{margin:0;background:#303030;color:white;font:13px sans-serif}iframe{display:block;margin:auto;width:390px;height:844px;border:0}</style><p id="result">검사 중…</p><iframe src="../index.html?judgment-split=4#/figma/learn:tips-end"></iframe><script>

</script>
