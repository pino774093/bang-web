<!doctype html><meta charset="utf-8"><title>판정 2장면 검증</title><style>body{margin:0;background:#303030;color:white;font:13px sans-serif}iframe{display:block;margin:auto;width:390px;height:844px;border:0}</style><p id="result">검사 중…</p><iframe src="../index.html?judgment-split=4#/figma/learn:attack-effects"></iframe><script>
const f=document.querySelector('iframe'),out=document.querySelector('#result');f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,pause=ms=>new Promise(r=>setTimeout(r,ms));let n=0;const check=(ok,label)=>{if(!ok)throw Error(label);n++};const wait=async fn=>{for(let i=0;i<180;i++){if(fn())return;await pause(20)}throw Error('이동/이미지 대기 초과')};const stage=()=>d.querySelector('.learning-stage');const current=id=>wait(()=>w.BangRouter.current==='learn:'+id&&!d.querySelector('#app').hasAttribute('aria-busy'));try{
await current('attack-effects');await d.fonts.ready;stage().querySelector('.attack-story-next').click();await current('attack-draw');check(stage().querySelectorAll('.judgment-process-step').length===3,'첫 장면 과정');check(!stage().querySelector('.judgment-reveal'),'첫 장면 공개 예시 없음');check(!stage().querySelector('.judgment-example'),'첫 장면 조건 카드 없음');check(stage().querySelector('.attack-story-text').textContent.includes('무늬와 숫자'),'판정 본문');check(stage().querySelector('.attack-story-note').textContent.includes('성공 여부와 관계없이'),'사용한 판정 카드 처리');
const fit=()=>{const s=stage(),copy=s.querySelector('.attack-story-copy').getBoundingClientRect(),nav=s.querySelector('.attack-story-next span').getBoundingClientRect();check(copy.bottom<nav.top,'설명 내비 겹침 없음');check(s.scrollWidth===390,'390 가로 넘침 없음')};fit();stage().querySelector('.attack-story-next').click();await current('attack-draw-examples');check(stage().querySelector('.field-step-label').textContent==='Step 4 : 판정','두번째 구분표');const copy=stage().querySelector('.attack-story-copy').textContent;
for(const b of stage().querySelectorAll('.judgment-example')){b.click();await pause(270);check(b.getAttribute('aria-expanded')==='true','펼침 상태');const drawer=stage().querySelector('.judgment-condition');check(drawer.textContent.includes({barile:'빗나감!',prigione:'턴을 건너뜁니다',dinamite:'생명력 3'}[b.dataset.judgment]),'조건과 예외');check(stage().querySelector('.attack-story-copy').textContent===copy,'검은 설명 그대로');const r=drawer.getBoundingClientRect(),p=stage().querySelector('.attack-story-dialogue').getBoundingClientRect();check(r.bottom<p.top,'조건 패널 검은 설명 밖에 표시');check(r.left>=stage().getBoundingClientRect().left&&r.right<=stage().getBoundingClientRect().right,'조건 패널 가로 맞춤');fit();}
const reveal=stage().querySelector('.judgment-reveal'),front=stage().querySelector('.judgment-card-front'),seen=new Set();for(let i=0;i<23;i++){reveal.click();await wait(()=>!reveal.disabled&&reveal.getAttribute('aria-pressed')==='true');check(front.naturalWidth>0,'공개 앞면 로딩');if(i<22){check(!seen.has(front.getAttribute('src')),'22종 반복 없는 랜덤 공개');seen.add(front.getAttribute('src'));}const before=front.getAttribute('src');reveal.click();await pause(370);check(reveal.getAttribute('aria-pressed')==='false','뒷면 복귀');if(i===21)window.lastFace=before;if(i===22)check(before!==window.lastFace,'새 순환도 연속 같은 카드 제외');}
check(seen.size===22,'지정 폴더 22종 전체 공개');check(!w.BANG_JUDGMENT_FACES.some(x=>/뒷/.test(x)),'뒷면 제외');stage().querySelector('.attack-story-prev').click();await current('attack-draw');stage().querySelector('.attack-story-prev').click();await current('attack-effects');check(!!stage().querySelector('[data-effect=scope]'),'사정거리 보존');stage().querySelector('.attack-story-next').click();await current('attack-draw');stage().querySelector('.attack-story-next').click();await current('attack-draw-examples');stage().querySelector('.attack-story-next').click();await current('tips-end');check(!!stage().querySelector('.tips-story'),'다음 STEP 이동');w.BangRouter.go('learn:attack-draw-examples',{instant:true});await current('attack-draw-examples');stage().querySelector('[data-judgment=dinamite]').click();out.textContent='PASS · '+n+'개 검사 · 390×844 · 두 장면/별도 슬라이드 조건/22종 랜덤/앞뒤 이동';
}catch(e){out.textContent='FAIL · '+e.message}};
</script>
