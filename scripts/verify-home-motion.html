<!doctype html><html lang="ko"><meta charset="utf-8"><title>홈 메뉴 인터랙션 검증</title><style>body{margin:0;background:#303030;color:white;font:13px sans-serif}iframe{display:block;width:390px;height:844px;margin:auto;border:0}p{margin:4px}</style><p id="result">홈 메뉴 검사 중…</p><iframe title="홈 메뉴 390×844" src="../index.html#/home"></iframe><script>
const f=document.querySelector('iframe'),out=document.querySelector('#result');
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument;let count=0;const check=(ok,label)=>{if(!ok)throw Error(label);count++;};const pause=ms=>new Promise(r=>setTimeout(r,ms));const wait=async fn=>{for(let i=0;i<150;i++){if(fn())return;await pause(40);}throw Error('화면 이동 대기 초과');};
try{await wait(()=>w.BangRouter&&d.querySelector('[data-learning-frame="5:4"]'));await d.fonts.ready;
const ids=[['8:326','8:311','47:2539'],['89:12','8:308','learn:search-menu'],['89:16','90:22','5:229']];
for(const [id,starId,destination]of ids){w.BangRouter.go('home',{instant:true});await wait(()=>w.BangRouter.current==='5:4');const stage=d.querySelector('#learning-screen .learning-stage');const target=stage.querySelector(`[data-source-node="${id}"]`),group=stage.querySelector(`[data-node-id="${id}"]`),star=stage.querySelector(`[data-node-id="${starId}"]`);const before=star.getBoundingClientRect(),art=group.querySelector('.learning-home-button-art');const artStyle=w.getComputedStyle(art);check(artStyle.width==='183px'&&artStyle.height==='66px','기존 버튼 크기');
target.click();check(w.BangRouter.current==='5:4','즉시 이동하지 않음');check(star.querySelector('img').getAttribute('src')==='assets/sheriff.svg','기존 별 이미지 유지');check(w.getComputedStyle(star,'::after').backgroundColor==='rgb(17, 17, 17)','검은 중앙 채움');check(stage.querySelectorAll('.home-star-selected').length===1,'다른 별 유지');check(group.classList.contains('home-menu-stamped'),'눌림 적용');check(star.style.width==='67px'&&star.style.height==='66px','별 크기 유지');if(!w.matchMedia('(prefers-reduced-motion: reduce)').matches){check(w.getComputedStyle(star,'::after').animationName==='home-star-fill','위에서 아래로 채우기');check(w.getComputedStyle(art).transitionProperty.includes('filter'),'버튼 밝기 전환');check(w.getComputedStyle(star).animationName==='none','별 회전 없음');}target.click();await wait(()=>w.BangRouter.current===destination);check(w.BangRouter.current===destination,'기존 메뉴 목적지');await pause(250);}
w.BangRouter.go('home',{instant:true});await wait(()=>w.BangRouter.current==='5:4');out.textContent='PASS · '+count+'개 검사 · 3개 메뉴 이동/별 중앙/눌림/기존 크기 · Enter·Space 수동 확인용 첫 버튼 선택';await wait(()=>!d.querySelector('#app').hasAttribute('aria-busy'));d.querySelector('[data-source-node="8:326"]').focus();
}catch(e){out.textContent='FAIL · '+e.message;}};
</script></html>
