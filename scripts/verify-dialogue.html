<!doctype html><meta charset="utf-8"><title>설명창 이전·다음 검증 중</title>
<style>body{display:flex;gap:24px;margin:20px;background:#eee;font:14px sans-serif}iframe{width:390px;height:844px;border:0;flex:none}pre{white-space:pre-wrap;max-width:550px}</style>
<iframe src="../index.html?review=1" title="390×844 설명창 테스트"></iframe><pre>검증 준비 중…</pre>
<script>
const iframe=document.querySelector('iframe'),report=document.querySelector('pre');
iframe.onload=async()=>{
 const w=iframe.contentWindow,d=w.document,results=[],errors=[];
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const check=(name,ok)=>{results.push({name,ok});report.textContent=results.map(r=>(r.ok?'✓ ':'✗ ')+r.name).join('\n');};
 const root=()=>d.querySelector('.learning-stage');
 const go=async id=>{w.BangRouter.go('learn:'+id,{instant:true,force:true});await wait(100);};
 const click=async selector=>{root().querySelector(selector).click();await wait(800);};
 w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
 try{
  await d.fonts.ready;
  let navigation=true,style=true,hit=true;
  for(const [from,to]of [['8:398','8:422'],['35:1228','35:1374'],['139:236','139:249']]){
   await go(from);
   const back=root().querySelector('.learning-dialogue-back'),next=root().querySelector('.learning-dialogue-next');
   const bl=back.querySelector('span'),nl=next.querySelector('span'),bs=w.getComputedStyle(bl),ns=w.getComputedStyle(nl),br=bl.getBoundingClientRect(),nr=nl.getBoundingClientRect(),b=back.getBoundingClientRect(),n=next.getBoundingClientRect();
   style&&=bs.color===ns.color&&bs.fontSize===ns.fontSize&&bs.fontFamily===ns.fontFamily&&bs.fontWeight==='400'&&Math.abs((br.left+br.width/2+nr.left+nr.width/2)-(b.left+n.right))<1;
   hit&&=d.elementFromPoint(b.left+b.width/2,b.top+70)===back&&d.elementFromPoint(n.left+n.width/2,n.top+70)===next;
   next.click();await wait(800);navigation&&=w.BangRouter.current==='learn:'+to;
   await click('.learning-dialogue-back');navigation&&=w.BangRouter.current==='learn:'+from;
  }
  check('STEP 1~3 오른쪽 다음 / 왼쪽 직전 페이지',navigation);
  check('뒤로<와 >클릭! 색·폰트·크기 동일 및 대칭',style);
  check('본문·여백의 좌우 클릭 영역',hit);
  await go('94:185');await click('[aria-label="배신자"]');await click('.learning-dialogue-back');check('역할 상세도 실제 직전 목록으로 복귀',w.BangRouter.current==='learn:94:185');
  await go('139:351');await click('.learning-dialogue-next');check('기존 STEP 3 흐름 유지',w.BangRouter.current==='learn:turn-timing');
  const tabs=[...root().querySelectorAll('[role=tab]')];tabs[1].click();await wait(50);check('타이밍 탭 선택 유지',tabs[1].getAttribute('aria-selected')==='true'&&w.BangRouter.current==='learn:turn-timing');
  await click('.turn-dialogue-back');check('추가 설명의 뒤로는 직전 원본 프레임',w.BangRouter.current==='learn:139:351');
  await go('turn-timing');await go('turn-cautions');root().querySelector('summary').click();await wait(100);check('규칙 펼치기 유지',root().querySelector('details').open&&w.BangRouter.current==='learn:turn-cautions');
  await click('.turn-dialogue-back');check('추가 설명 사이 뒤로가기',w.BangRouter.current==='learn:turn-timing');
  await go('131:1182');w.history.replaceState({bang:true,index:0,frame:'learn:131:1182'},'',w.location.href);await click('.learning-dialogue-back');check('이력이 없는 직접 접속은 STEP 목차로',w.BangRouter.current===w.BANG_FIGMA_FLOW.menu);
  check('390px 가로 넘침·실행 오류 없음',d.documentElement.scrollWidth===390&&errors.length===0);
  await go('139:249');
  const liveURL=new URL(w.location.href);liveURL.searchParams.delete('review');w.history.replaceState(w.history.state,'',liveURL.href);w.BangLearning.activate();
  document.title=results.every(r=>r.ok)?'PASS — 설명창 이전·다음 검증':'FAIL — 설명창 이전·다음 검증';
 }catch(error){check(error.stack,false);document.title='FAIL — 설명창 이전·다음 검증';}
};
</script>
