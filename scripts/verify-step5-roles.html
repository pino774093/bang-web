<!doctype html><meta charset="utf-8"><title>STEP 5 역할별 전략 검증</title><style>body{margin:0;background:#303030;color:white;font:13px sans-serif}iframe{display:block;margin:auto;width:390px;height:844px;border:0}</style><p id="result">검사 중…</p><iframe src="../index.html?tips-role-review=2#/figma/learn:tips-end"></iframe><script>
const f=document.querySelector('iframe'),out=document.querySelector('#result');f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,pause=ms=>new Promise(r=>setTimeout(r,ms));let n=0;const check=(ok,label)=>{if(!ok)throw Error(label);n++};const wait=async fn=>{for(let i=0;i<150;i++){if(fn())return;await pause(30)}throw Error('화면 대기 초과')};const stage=()=>d.querySelector('.learning-stage'),root=()=>d.querySelector('.tips-story');const current=id=>wait(()=>w.BangRouter.current==='learn:'+id&&!d.querySelector('#app').hasAttribute('aria-busy'));try{await wait(()=>root()?.querySelector('.tips-story-role-image'));await d.fonts.ready;const ids=['tips-end','tips-rules','tips-special','tips-roles','tips-mind'],keys=['sceriffo','vice','fuorilegge','rinnegato','뒷장'];
for(let i=0;i<5;i++){const id=ids[i];w.BangRouter.go('learn:'+id,{instant:true});await current(id);await pause(120);check(root().dataset.scene===String(i+1),'5개 장면 순서');const im=root().querySelector('.tips-story-role-image');await wait(()=>im.complete);check(im.naturalWidth>0,'원본 카드 로딩');check(im.getAttribute('src')===w.BANG_CARDS.find(c=>c.name.replace(/^\d+_/,'')===keys[i]).src,'STEP 2 역할 카드 재사용');check(root().querySelectorAll('.tips-story-visual img').length===1,'중앙 카드 한 장');check(!root().querySelector('details,input,select,.tips-story-player'),'추가 복잡한 상호작용 없음');check(root().querySelector('.tips-story-note').textContent.includes('전략 예시'),'규칙과 전략 구분');check(stage().scrollWidth===390,'가로 넘침');const a=im.getBoundingClientRect(),panel=root().querySelector('.tips-story-dialogue').getBoundingClientRect(),heading=root().querySelector('.tips-story-scene-title').getBoundingClientRect(),copy=root().querySelector('.tips-story-copy').getBoundingClientRect(),label=root().querySelector('.tips-story-next span').getBoundingClientRect();check(a.bottom<panel.top,'카드 잘림·패널 겹침 없음');check(heading.bottom<=copy.top,'제목과 설명 겹침 없음');check(copy.bottom<label.top,'설명과 다음 버튼 겹침 없음: '+id);if(i>0){root().querySelector('.tips-story-prev').click();await current(ids[i-1]);check(true,'이전 장면');w.BangRouter.go('learn:'+id,{instant:true});await current(id)}root().querySelector('.tips-story-next').click();await wait(()=>w.BangRouter.current===(i<4?'learn:'+ids[i+1]:w.BANG_FIGMA_FLOW.menu));check(true,'다음 장면·목차 연결')}
w.BangRouter.go('learn:tips-end',{instant:true});await current('tips-end');root().querySelector('.field-menu').click();await wait(()=>stage().querySelector('.learning-drawer'));stage().querySelector('.learning-drawer-step[data-step="5"]').click();check(stage().querySelectorAll('.learning-contents-topics.is-expanded button').length===5,'목차의 역할별 5개 항목');stage().querySelector('.learning-contents-subtopic[data-target="tips-mind"]').click();await current('tips-mind');check(true,'공통 심리전 직접 이동');w.BangRouter.go('learn:tips-end',{instant:true});await current('tips-end');out.textContent='PASS · '+n+'개 검사 · 5개 장면 · 390×844 · 원본 카드/앞뒤 이동/목차/글자 잘림 없음';}catch(e){out.textContent='FAIL · '+e.message}};
</script>
