<!doctype html><meta charset="utf-8"><title>STEP 5 수사 파일 검증</title><style>body{margin:0;background:#303030;color:white;font:13px sans-serif}iframe{display:block;margin:auto;width:390px;height:844px;border:0}</style><p id="result">검사 중…</p><iframe src="../index.html?tips-review=1#/figma/learn:tips-end"></iframe><script>
const f=document.querySelector('iframe'),out=document.querySelector('#result');f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,pause=ms=>new Promise(r=>setTimeout(r,ms));let n=0;const check=(ok,label)=>{if(!ok)throw Error(label);n++};const wait=async fn=>{for(let i=0;i<150;i++){if(fn())return;await pause(30)}throw Error('화면 대기 초과')};const stage=()=>d.querySelector('.learning-stage'),root=()=>d.querySelector('.tips-story');const current=id=>wait(()=>w.BangRouter.current==='learn:'+id&&!d.querySelector('#app').hasAttribute('aria-busy'));const fit=()=>{const copy=root().querySelector('.tips-story-copy').getBoundingClientRect(),label=root().querySelector('.tips-story-next span').getBoundingClientRect();check(copy.bottom<label.top,'설명과 내비게이션 겹침 없음');check(stage().scrollWidth===390,'가로 넘침 없음')};try{await wait(()=>root());await d.fonts.ready;for(const [i,id]of ['tips-end','tips-rules','tips-special','tips-roles'].entries()){w.BangRouter.go('learn:'+id,{instant:true});await current(id);await pause(100);check(root().dataset.scene===String(i+1),'장면 순서');check(root().querySelector('.tips-story-text').textContent.length>20,'기본 설명');fit();for(const im of root().querySelectorAll('img')){await wait(()=>im.complete);check(im.naturalWidth>0,'기존 이미지 로딩')}
if(i===0){const players=root().querySelectorAll('.tips-story-player');check(players.length===5,'기존 5인 배치');for(const b of players){b.click();check(b.getAttribute('aria-pressed')==='true','플레이어 선택');check(root().querySelector('.tips-story-note').textContent.includes('확정하지'),'정체 확정 없음');fit()}}
if(i===1||i===2){const detail=root().querySelector('details');check(!detail.open,'기록 접힌 상태');detail.querySelector('summary').click();await pause(100);check(detail.open,'기록 펼치기');fit();const r=detail.getBoundingClientRect(),p=root().querySelector('.tips-story-dialogue').getBoundingClientRect();check(r.bottom<p.top,'중앙 기록과 하단 패널 겹침 없음');detail.querySelector('summary').click();await pause(60);check(!detail.open,'기록 다시 접기')}
root().querySelector('.tips-story-next').click();await wait(()=>w.BangRouter.current===(i<3?'learn:'+['tips-rules','tips-special','tips-roles'][i]:w.BANG_FIGMA_FLOW.menu));check(true,'다음 장면·목차 연결')}
w.BangRouter.go('learn:tips-rules',{instant:true});await current('tips-rules');root().querySelector('.tips-story-prev').click();await current('tips-end');check(true,'이전 장면 연결');out.textContent='PASS · '+n+'개 검사 · 4개 장면 · 390×844 · 플레이어/문서/앞뒤 이동/글자 겹침 없음';}catch(e){out.textContent='FAIL · '+e.message}};
</script>
