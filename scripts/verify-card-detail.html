const f=document.querySelector('iframe'),out=document.querySelector('#result');
f.onload=async()=>{let count=0;const w=f.contentWindow,d=f.contentDocument;const check=(condition,label)=>{if(!condition)throw Error(label);count++;};const wait=async(fn)=>{for(let i=0;i<100;i++){if(fn())return;await new Promise(r=>setTimeout(r,50));}throw Error('화면 이동 대기 초과');};try{
 await wait(()=>d.querySelector('.card-guide'));await d.fonts.ready;
 const guide=d.querySelector('.card-guide'),area=d.querySelector('.card-library');
 check(Math.abs(d.querySelector('.design-stage').getBoundingClientRect().width-390)<1,'390px 너비');

 const rows=[...guide.querySelectorAll('details')];check(rows.length===w.BANG_CARD_DETAIL_PAGES.bang.rules.length+(w.BANG_CARD_DETAIL_PAGES.bang.faq?.length||0),'규칙과 남은 FAQ 개수');check([...guide.querySelectorAll('h3')].some(h=>h.textContent==='자주 묻는 질문'),'상황별 FAQ 표시');check(guide.querySelectorAll('.card-guide-core-list li').length===3&&!guide.querySelector('.card-guide-core').closest('details'),'핵심 규칙 항상 표시');

 const links=[...guide.querySelectorAll('.card-guide-related-card')];check(links.length===6,'관련 카드 6개');
 const page=w.BANG_CARD_DETAIL_PAGES.bang;
 for(const [key,title]of page.related){const link=[...d.querySelectorAll('.card-guide-related-card')].find(b=>b.textContent===title);link.click();await wait(()=>!d.querySelector('.card-guide')&&d.querySelector('.card-library-detail'));check(d.querySelector('.card-library-detail h2').textContent.length>0,'관련 카드 이동 '+key);w.BangRouter.go(w.BANG_FIGMA_FLOW.cards,{card:0});await wait(()=>d.querySelector('.card-guide'));}

 check(d.querySelector('.card-library').scrollHeight>d.querySelector('.card-library').clientHeight,'세로 스크롤');
 check(!/해요|있어요/.test(d.querySelector('.card-guide').textContent),'격식체');
 out.textContent='PASS · '+count+'개 검사 · 390×844 · 이미지/접기·펼치기/관련 카드/하단 메뉴/가로 넘침';d.querySelector('.card-library').scrollTop=0;

</script></html>
