const f=document.querySelector('iframe'),out=document.querySelector('#result');f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument,pause=ms=>new Promise(r=>setTimeout(r,ms));let n=0;const check=(ok,label)=>{if(!ok)throw Error(label);n++};const wait=async fn=>{for(let i=0;i<150;i++){if(fn())return;await pause(30)}throw Error('이동 대기 초과')};const stage=()=>d.querySelector('.learning-stage');const current=id=>wait(()=>w.BangRouter.current==='learn:'+id&&!d.querySelector('#app').hasAttribute('aria-busy'));try{await wait(()=>stage()?.querySelector('.learning-dialogue-next'));await d.fonts.ready;check(stage().textContent.includes('총격전 게임입니다'),'기존 소개 보존');const images=[...stage().querySelectorAll('img')].map(i=>i.getAttribute('src'));stage().querySelector('.learning-dialogue-next').click();await current('intro-goal');check(stage().textContent.includes('서로의 역할을 추리하고')&&stage().textContent.includes('각자의 목표를 완수하세요!'),'요청 문구 추가');check(JSON.stringify(images)===JSON.stringify([...stage().querySelectorAll('img')].map(i=>i.getAttribute('src'))),'동일한 이미지 구성');check(stage().scrollWidth===390,'가로 넘침 없음');const panel=stage().querySelector('[data-node-id="8:396"]').getBoundingClientRect(),copy=stage().querySelector('[data-node-id="8:362"]').getBoundingClientRect();check(copy.top>panel.top&&copy.bottom<panel.bottom,'설명창 안에 문구 표시');stage().querySelector('.learning-dialogue-back').click();await current('8:330');check(true,'뒤로 원래 소개');stage().querySelector('.learning-dialogue-next').click();await current('intro-goal');stage().querySelector('.learning-dialogue-next').click();await current('8:398');check(true,'기존 다음 장면 연결');w.BangRouter.go('learn:intro-goal',{instant:true});await current('intro-goal');out.textContent='PASS · '+n+'개 검사 · 같은 화면/새 문구/이전·다음 연결/390×844';}catch(e){out.textContent='FAIL · '+e.message}};
</script>
