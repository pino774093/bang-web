const f=document.querySelector('iframe'),result=document.querySelector('#result');
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument;let checks=0;const assert=(value,label)=>{if(!value)throw Error(label);checks++;};const wait=async(fn)=>{for(let i=0;i<150;i++){if(fn())return;await new Promise(r=>setTimeout(r,40));}throw Error('이동 대기 초과');};const turn=()=>Promise.resolve();const pause=()=>new Promise(r=>setTimeout(r,160));
try{
 await wait(()=>d.querySelector('.card-guide'));await d.fonts.ready;
 const entries=w.BANG_CARDS.map((card,index)=>({card,index,key:card.name.replace(/^\d+_/,'')})).filter(e=>e.key!=='뒷장');
 for(const entry of entries){
  const page=w.BANG_CARD_DETAIL_PAGES[entry.key];w.BangRouter.go(w.BANG_FIGMA_FLOW.cards,{card:entry.index});await pause();await wait(()=>d.querySelector('.card-guide h2')?.textContent===page.title);await turn();
  const guide=d.querySelector('.card-guide'),area=d.querySelector('.card-library'),stage=d.querySelector('#reference-screen .design-stage');
  assert(Math.abs(stage.getBoundingClientRect().width-390)<1,'390px 구성');
  assert(guide.querySelector('.card-guide-core-list').children.length===page.coreRules.length,entry.key+' 핵심 규칙');
  const img=guide.querySelector('.card-guide-image');await wait(()=>img.complete);assert(img.naturalWidth>0,entry.key+' 원본 이미지');
  assert(area.scrollWidth<=area.clientWidth+1,entry.key+' 가로 넘침');
  for(const detail of guide.querySelectorAll('details')){assert(!detail.open,'접힌 초기 상태');detail.querySelector('summary').click();await turn();assert(detail.open&&area.scrollWidth<=area.clientWidth+1,entry.key+' 펼침과 줄바꿈');detail.querySelector('summary').click();assert(!detail.open,'다시 접기');}
  const tabs=d.querySelector('.search-page-tabs');assert(area.getBoundingClientRect().bottom<tabs.getBoundingClientRect().top,'하단 메뉴 겹침 없음');
  for(const link of [...guide.querySelectorAll('.card-guide-related-card')]){const label=link.textContent;link.click();await pause();await wait(()=>d.querySelector('.card-guide')!==guide);assert(!!d.querySelector('.card-guide'),label+' 상세 연결');w.BangRouter.go(w.BANG_FIGMA_FLOW.cards,{card:entry.index});await pause();await wait(()=>d.querySelector('.card-guide h2')?.textContent===page.title);}
 }
 w.BangRouter.go(w.BANG_FIGMA_FLOW.cards,{card:0});await wait(()=>d.querySelector('.card-guide h2')?.textContent==='뱅! (BANG!)');
 result.textContent='PASS · 42종 · '+checks+'개 검사 · 390×844 · 이미지/핵심 규칙/아코디언/관련 카드/가로 넘침/하단 메뉴';
}catch(e){result.textContent='FAIL · '+e.message;}
};
</script></html>
